name: Heartbeat Ping

on:
  schedule:
    # Every 3 days at 06:00 UTC
    # Cron does not support "every N days" natively,
    # so we run on days 1, 4, 7, 10, 13, 16, 19, 22, 25, 28 of each month.
    - cron: '0 6 1,4,7,10,13,16,19,22,25,28 * *'

  # Allow a manual trigger from the GitHub Actions UI for testing.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping heartbeat endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "https://${{ secrets.HEARTBEAT_DOMAIN }}/api/heartbeat?token=${{ secrets.HEARTBEAT_SECRET }}"
